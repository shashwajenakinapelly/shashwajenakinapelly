name: Build Executive Contribution Matrix

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Main Repository
        uses: actions/checkout@v4

      - name: Generate Raw Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: coderwrexx
          outputs: |
            dist/raw-snake.svg?palette=github-dark&color_snake=#eab308&color_dots=#141419,#064e3b,#047857,#059669,#10b981

      - name: Compile Validated Obsidian & Gold Executive Frame
        run: |
          python3 - << 'EOF'
          import re

          with open("dist/raw-snake.svg", "r", encoding="utf-8") as f:
              raw = f.read()

          vb_match = re.search(r'viewBox="([^"]+)"', raw)
          viewbox = vb_match.group(1) if vb_match else "-16 -32 880 192"

          # Strip outer <svg ...> and </svg> safely while preserving all internal <style>, <defs>, and elements
          start_idx = raw.find(">", raw.find("<svg")) + 1
          end_idx = raw.rfind("</svg>")
          inner = raw[start_idx:end_idx].strip()

          framed = f'''<?xml version="1.0" encoding="UTF-8"?>
          <svg width="900" height="295" viewBox="0 0 900 295" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <style>
                .exec-mono {{ font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; }}
                @keyframes pulseBeacon {{ 0% {{ r: 4.5; opacity: 0.9; }} 100% {{ r: 14; opacity: 0; }} }}
                @keyframes sweepLine {{ 0% {{ transform: translateX(-300px); }} 100% {{ transform: translateX(900px); }} }}
                .beacon-ring {{ animation: pulseBeacon 2.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }}
                .laser-line {{ animation: sweepLine 4.2s cubic-bezier(0.4, 0, 0.2, 1) infinite; }}
              </style>
              <linearGradient id="matrixBg" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#040406"/>
                <stop offset="50%" stop-color="#0b0b10"/>
                <stop offset="100%" stop-color="#040406"/>
              </linearGradient>
              <linearGradient id="goldEmeraldBorder" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#27272a"/>
                <stop offset="35%" stop-color="#eab308" stop-opacity="0.6"/>
                <stop offset="65%" stop-color="#10b981" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#27272a"/>
              </linearGradient>
              <linearGradient id="topSweep" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#eab308" stop-opacity="0"/>
                <stop offset="50%" stop-color="#fafafa" stop-opacity="0.75"/>
                <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
              </linearGradient>
              <pattern id="subGrid" width="28" height="28" patternUnits="userSpaceOnUse">
                <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#ffffff" stroke-opacity="0.02" stroke-width="1"/>
              </pattern>
            </defs>

            <rect width="900" height="295" rx="16" fill="url(#matrixBg)"/>
            <rect width="900" height="295" rx="16" fill="url(#subGrid)"/>
            <rect x="1" y="1" width="898" height="293" rx="15" stroke="url(#goldEmeraldBorder)" stroke-width="1.5"/>

            <circle cx="36" cy="36" r="4.5" fill="#10b981"/>
            <circle cx="36" cy="36" r="4.5" stroke="#10b981" stroke-width="1.2" fill="none" class="beacon-ring"/>
            <text x="54" y="40" fill="#fafafa" class="exec-mono" font-size="11.5" font-weight="800" letter-spacing="2">52-WEEK CONTRIBUTION MATRIX // AUTONOMOUS EXECUTION TRACE</text>
            <text x="866" y="40" text-anchor="end" fill="#eab308" class="exec-mono" font-size="11" font-weight="700" letter-spacing="1">&#9733; 326-DAY ACTIVE STREAK</text>
            <line x1="28" y1="56" x2="872" y2="56" stroke="#27272a" stroke-width="1"/>

            <svg x="24" y="64" width="852" height="184" viewBox="{viewbox}" xmlns="http://www.w3.org/2000/svg">
              {inner}
            </svg>

            <line x1="28" y1="254" x2="872" y2="254" stroke="#27272a" stroke-width="1"/>
            <text x="32" y="276" fill="#71717a" class="exec-mono" font-size="10" letter-spacing="1.5">SOURCE: GITHUB GRAPH TELEMETRY  &#8226;  1,866+ VERIFIED COMMITS</text>
            <rect x="650" y="268" width="10" height="10" rx="2" fill="#141419" stroke="#27272a"/>
            <rect x="666" y="268" width="10" height="10" rx="2" fill="#064e3b"/>
            <rect x="682" y="268" width="10" height="10" rx="2" fill="#047857"/>
            <rect x="698" y="268" width="10" height="10" rx="2" fill="#059669"/>
            <rect x="714" y="268" width="10" height="10" rx="2" fill="#10b981"/>
            <circle cx="744" cy="273" r="4.5" fill="#eab308"/>
            <text x="756" y="276" fill="#a1a1aa" class="exec-mono" font-size="10" font-weight="700">ACTIVE AGENT</text>

            <rect x="0" y="0" width="300" height="2" fill="url(#topSweep)" class="laser-line"/>
          </svg>'''

          # Validate XML syntax strictly before saving
          import xml.etree.ElementTree as ET
          ET.fromstring(framed)

          with open("framed-snake.svg", "w", encoding="utf-8") as f:
              f.write(framed)
          print("XML validation passed: framed-snake.svg generated cleanly.")
          EOF

      - name: Commit Validated SVG to Main Branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add framed-snake.svg
          git diff --staged --quiet || git commit -m "chore: update validated framed contribution matrix"
          git push
          

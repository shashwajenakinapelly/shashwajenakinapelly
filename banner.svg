<svg width="900" height="220" viewBox="0 0 900 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#121216"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>
    <linearGradient id="beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="900" height="220" rx="14" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="218" rx="13" stroke="url(#borderGrad)" stroke-width="1.5"/>

  <circle cx="36" cy="36" r="4.5" fill="#10b981">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="50" y="40" fill="#a1a1aa" font-family="monospace" font-size="11" font-weight="bold" letter-spacing="2">DESKSPACE TECHNOLOGIES PVT. LTD. // OFFICE OF THE CHAIRMAN</text>
  <text x="864" y="40" text-anchor="end" fill="#71717a" font-family="monospace" font-size="11">EST. 2018 • HYDERABAD, IN</text>
  <line x1="28" y1="56" x2="872" y2="56" stroke="#27272a" stroke-width="1"/>

  <text x="450" y="108" text-anchor="middle" fill="#fafafa" font-family="system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="6">SHASHWAJEN AKINAPELLY</text>

  <text x="450" y="138" text-anchor="middle" fill="#a1a1aa" font-family="monospace" font-size="13" letter-spacing="2.5">FOUNDER &amp; CHAIRMAN  •  AI INFRASTRUCTURE &amp; SYSTEMS ARCHITECTURE</text>

  <rect x="140" y="160" width="620" height="34" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="442" y="181" text-anchor="middle" fill="#e4e4e7" font-family="monospace" font-size="12" letter-spacing="1">&gt; AUTONOMOUS AGENTS  •  LOCAL LLM RUNTIMES  •  ENTERPRISE SYSTEMS</text>
  <rect x="698" y="170" width="7" height="14" fill="#fafafa">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>

  <rect x="-300" y="0" width="300" height="2" fill="url(#beam)">
    <animate attributeName="x" from="-300" to="900" dur="4s" repeatCount="indefinite"/>
  </rect>

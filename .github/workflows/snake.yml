name: Generate Live Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Contribution Snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: coderwrexx
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#eab308&color_dots=#161b22,#0e4429,#006d32,#26a641,#10b981

      - name: Push SVG to Repository
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
